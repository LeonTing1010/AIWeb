<?xml version="1.0" encoding="UTF-8"?>
<svg width="500" height="400" viewBox="0 0 500 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Brain background -->
  <ellipse cx="250" cy="200" rx="180" ry="160" fill="#f0f4ff" />
  
  <!-- Brain outline -->
  <path d="M320 170C350 140 350 200 320 220C290 240 310 280 270 290C230 300 210 270 180 270C150 270 130 300 130 260C130 220 160 220 160 190C160 160 190 130 230 130C270 130 290 200 320 170Z" stroke="#4056c7" stroke-width="4" fill="#ffffff" />
  
  <!-- Brain details -->
  <path d="M230 130C240 150 250 150 270 130" stroke="#4056c7" stroke-width="3" />
  <path d="M160 190C180 200 190 190 200 170" stroke="#4056c7" stroke-width="3" />
  <path d="M320 170C300 190 300 210 320 220" stroke="#4056c7" stroke-width="3" />
  <path d="M270 290C240 270 240 260 180 270" stroke="#4056c7" stroke-width="3" />
  
  <!-- Mental health symbols -->
  <circle cx="200" cy="190" r="15" fill="#ffe3d1" stroke="#ff7d4d" stroke-width="2" />
  <circle cx="270" cy="220" r="15" fill="#d1ffe3" stroke="#4dff7d" stroke-width="2" />
  <circle cx="230" cy="250" r="15" fill="#d1e3ff" stroke="#4d7dff" stroke-width="2" />
  
