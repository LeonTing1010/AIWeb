  <line x1="200" y1="190" x2="240" y2="210" stroke="#4056c7" stroke-width="1.5" stroke-dasharray="4 2" />
  
  <!-- Text label -->
  <text x="250" y="340" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" fill="#4056c7">SCL-90 Assessment</text>
